openapi: 3.1.0
info:
  title: TeamZeit API
  version: 0.2.0
  description: Tenant-safe direct work-interval time tracking.
servers: [{ url: /api/v1 }]
security: [{ bearerAuth: [] }]
paths:
  /month-closures/{membershipId}/{month}:
    get:
      operationId: getMonthClosure
      tags: [MonthClosing]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/MembershipId' }, { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }]
      responses: { '200': { description: Current open or closed status }, '403': { $ref: '#/components/responses/Forbidden' } }
  /month-closures/close:
    post:
      operationId: closeMonth
      tags: [MonthClosing]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonthClosureCommand' } } } }
      responses: { '200': { description: Month closed and audited }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /month-closures/reopen:
    post:
      operationId: reopenMonth
      tags: [MonthClosing]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonthClosureCommand' } } } }
      responses: { '200': { description: Month reopened and audited }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /employees:
    get:
      operationId: listEmployees
      tags: [Identity]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Tenant employee administration list }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createEmployee
      tags: [Identity]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEmployee' } } } }
      responses: { '201': { description: Invited employee record created without sending an invitation }, '403': { $ref: '#/components/responses/Forbidden' } }
  /employees/{membershipId}/invitation:
    post:
      operationId: sendEmployeeInvitation
      tags: [Identity]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/MembershipId' }]
      responses: { '200': { description: Invitation sent or resent }, '403': { $ref: '#/components/responses/Forbidden' } }
  /employees/invitations:
    post:
      operationId: inviteEmployee
      tags: [Identity]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InviteEmployee' } } } }
      responses: { '201': { description: Invitation and invited membership created }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /employees/{membershipId}/deactivate:
    post:
      operationId: deactivateEmployee
      tags: [Identity]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/MembershipId' }]
      responses: { '200': { description: Membership deactivated and audited }, '403': { $ref: '#/components/responses/Forbidden' } }
  /employees/{membershipId}/assignment:
    patch:
      operationId: updateEmployeeAssignment
      tags: [Identity]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/MembershipId' }]
      responses: { '200': { description: Role, team, and work policy assignment updated and audited }, '403': { $ref: '#/components/responses/Forbidden' } }
  /attendance/today:
    get:
      operationId: getTodayAttendance
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Current day including intervals and derived totals, content: { application/json: { schema: { $ref: '#/components/schemas/TodayAttendance' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /attendance/days/{workDate}:
    get:
      operationId: getDailyAttendance
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { name: workDate, in: path, required: true, schema: { type: string, format: date } }]
      responses: { '200': { description: Daily interval overview, content: { application/json: { schema: { $ref: '#/components/schemas/DailyAttendance' } } } } }
  /attendance/months/{month}:
    get:
      operationId: getMonthlyAttendance
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      responses: { '200': { description: Monthly totals, content: { application/json: { schema: { $ref: '#/components/schemas/MonthlyAttendance' } } } } }
  /attendance/employees/{membershipId}/work-rule:
    get:
      operationId: getEmployeeWorkRule
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/MembershipId' }, { name: on, in: query, required: true, schema: { type: string, format: date } }]
      responses: { '200': { description: Effective work rule or an empty object when no rule exists, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeWorkRuleResponse' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: setEmployeeWorkRule
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/MembershipId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetEmployeeWorkRule' } } } }
      responses: { '200': { description: Effective-dated employee work rule created and audited }, '403': { $ref: '#/components/responses/Forbidden' } }
  /attendance/commands/clock-in:
    post:
      operationId: clockIn
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/ClockCommand' }, '409': { $ref: '#/components/responses/Conflict' } }
  /attendance/commands/clock-out:
    post:
      operationId: clockOut
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/ClockCommand' }, '409': { $ref: '#/components/responses/Conflict' } }
  /attendance/commands/break-start:
    post:
      deprecated: true
      operationId: deprecatedBreakStartAsClockOut
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/ClockCommand' } }
  /attendance/commands/break-end:
    post:
      deprecated: true
      operationId: deprecatedBreakEndAsClockIn
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/ClockCommand' } }
  /attendance/sessions:
    get:
      operationId: listOwnIntervals
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { name: from, in: query, required: true, schema: { type: string, format: date }, description: Inclusive start date }, { name: to, in: query, required: true, schema: { type: string, format: date }, description: Inclusive end date; must not precede from and the range is limited to 366 days }]
      responses: { '200': { description: Own intervals } }
    post:
      operationId: createOwnInterval
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInterval' } } } }
      responses: { '201': { description: Interval created immediately, content: { application/json: { schema: { $ref: '#/components/schemas/WorkSession' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /reports/attendance/{month}:
    get:
      operationId: monthlyAttendanceReport
      tags: [Reporting]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200': { description: Scope-aware monthly attendance report }
        '403': { $ref: '#/components/responses/Forbidden' }
  /attendance/sessions/{sessionId}:
    put:
      operationId: updateOwnInterval
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/SessionId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateInterval' } } } }
      responses: { '200': { description: Interval updated immediately }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      operationId: archiveOwnInterval
      tags: [TimeTracking]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/SessionId' }, { name: expectedVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Interval archived immediately }, '409': { $ref: '#/components/responses/Conflict' } }
  /organisation-structure:
    get:
      operationId: getOrganisationStructure
      tags: [OrganisationStructure]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { name: on, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: Date-effective structure visible to the actor, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationStructure' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /organisation-structure/locations:
    post:
      operationId: createLocation
      tags: [OrganisationStructure]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NamedStructure' } } } }
      responses: { '200': { description: Location created and audited }, '403': { $ref: '#/components/responses/Forbidden' } }
  /organisation-structure/teams:
    post:
      operationId: createTeam
      tags: [OrganisationStructure]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NamedStructure' } } } }
      responses: { '200': { description: Team created and audited }, '403': { $ref: '#/components/responses/Forbidden' } }
  /organisation-structure/assignments:
    post:
      operationId: setTeamAssignment
      tags: [OrganisationStructure]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeamAssignment' } } } }
      responses: { '200': { description: Effective assignment created and audited }, '409': { $ref: '#/components/responses/Conflict' } }
  /organisation-structure/manager-scopes:
    post:
      operationId: setManagerScope
      tags: [OrganisationStructure]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerScope' } } } }
      responses: { '200': { description: Effective manager scope created and audited }, '403': { $ref: '#/components/responses/Forbidden' } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    OrganizationId: { name: X-Organization-Id, in: header, required: true, schema: { type: string, format: uuid }, description: Tenant selector verified against the authenticated membership. }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    MembershipId: { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    ClockCommand: { description: Server-time clock result, content: { application/json: { schema: { type: object, required: [serverTime, session], properties: { serverTime: { type: string, format: date-time }, session: { $ref: '#/components/schemas/WorkSession' } } } } } }
    Forbidden: { description: Active tenant membership or ownership missing }
    Conflict: { description: Invalid state, stale version, overlap, duplicate action, or closed period }
  schemas:
    NamedStructure:
      type: object
      additionalProperties: false
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 120 }, locationId: { type: [string, 'null'], format: uuid } }
    TeamAssignment:
      type: object
      additionalProperties: false
      required: [membershipId, teamId, validFrom]
      properties: { membershipId: { type: string, format: uuid }, teamId: { type: string, format: uuid }, validFrom: { type: string, format: date }, validUntil: { type: [string, 'null'], format: date }, primary: { type: boolean, default: true } }
    ManagerScope:
      type: object
      additionalProperties: false
      required: [managerMembershipId, scopeType, validFrom]
      properties: { managerMembershipId: { type: string, format: uuid }, scopeType: { type: string, enum: [location, team] }, locationId: { type: string, format: uuid }, teamId: { type: string, format: uuid }, validFrom: { type: string, format: date }, validUntil: { type: [string, 'null'], format: date } }
    OrganisationStructure:
      type: object
      required: [locations, teams, assignments, managerScopes]
      properties:
        locations: { type: array, items: { type: object } }
        teams: { type: array, items: { type: object } }
        assignments: { type: array, items: { $ref: '#/components/schemas/TeamAssignment' } }
        managerScopes: { type: array, items: { $ref: '#/components/schemas/ManagerScope' } }
    MonthClosureCommand:
      type: object
      additionalProperties: false
      required: [membershipId, month, reason]
      properties: { membershipId: { type: string, format: uuid }, month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, reason: { type: string, minLength: 3, maxLength: 500 } }
    InviteEmployee:
      type: object
      additionalProperties: false
      required: [email, role]
      properties: { email: { type: string, format: email }, role: { type: string, enum: [admin, manager, employee, auditor] }, teamId: { type: string, format: uuid }, workPolicyId: { type: string, format: uuid } }
    CreateEmployee:
      type: object
      additionalProperties: false
      required: [email, role]
      properties: { email: { type: string, format: email }, role: { type: string, enum: [admin, manager, employee, auditor] } }
    WorkSession:
      type: object
      required: [id, organizationId, membershipId, workDate, startedAt, state, source, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        workDate: { type: string, format: date }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        workedMinutes: { type: integer, minimum: 0 }
        calculationEndedAt: { type: string, format: date-time }
        issue: { type: string, enum: [missing_clock_out] }
        state: { type: string, enum: [not_started, working, completed, requires_action] }
        source: { type: string, enum: [clock, manual, admin_import] }
        version: { type: integer, minimum: 1 }
    CreateInterval:
      type: object
      additionalProperties: false
      required: [workDate, startedAt, endedAt]
      properties: { workDate: { type: string, format: date }, startedAt: { type: string, format: date-time }, endedAt: { type: string, format: date-time } }
    UpdateInterval:
      allOf: [{ $ref: '#/components/schemas/CreateInterval' }, { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer, minimum: 1 } } }]
    SetEmployeeWorkRule:
      type: object
      additionalProperties: false
      required: [effectiveFrom, weekdayMinutes]
      properties:
        effectiveFrom: { type: string, format: date }
        weekdayMinutes: { type: object, required: [monday, tuesday, wednesday, thursday, friday, saturday, sunday], additionalProperties: false, properties: { monday: { type: integer, minimum: 0, maximum: 1440 }, tuesday: { type: integer, minimum: 0, maximum: 1440 }, wednesday: { type: integer, minimum: 0, maximum: 1440 }, thursday: { type: integer, minimum: 0, maximum: 1440 }, friday: { type: integer, minimum: 0, maximum: 1440 }, saturday: { type: integer, minimum: 0, maximum: 1440 }, sunday: { type: integer, minimum: 0, maximum: 1440 } } }
        breakThresholdMinutes: { type: integer, default: 360 }
        minimumBreakMinutes: { type: integer, default: 30 }
    EmployeeWorkRule:
      allOf:
        - { $ref: '#/components/schemas/SetEmployeeWorkRule' }
        - type: object
          required: [id, organizationId, membershipId]
          properties:
            id: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            membershipId: { type: string, format: uuid }
            effectiveTo: { type: string, format: date }
    EmployeeWorkRuleResponse:
      type: object
      additionalProperties: false
      properties:
        rule: { $ref: '#/components/schemas/EmployeeWorkRule' }
    DailyAttendance:
      type: object
      required: [workDate, state, sessions, workedMinutes, breakMinutes, recordedBreakMinutes, automaticBreakMinutes, plannedMinutes, balanceMinutes, isHoliday, requiresAction]
      properties: { workDate: { type: string, format: date }, state: { type: string, enum: [not_started, working, completed, requires_action] }, sessions: { type: array, items: { $ref: '#/components/schemas/WorkSession' } }, workedMinutes: { type: integer }, breakMinutes: { type: integer }, recordedBreakMinutes: { type: integer }, automaticBreakMinutes: { type: integer }, plannedMinutes: { type: integer }, balanceMinutes: { type: integer }, isHoliday: { type: boolean }, requiresAction: { type: boolean } }
    TodayAttendance:
      allOf: [{ $ref: '#/components/schemas/DailyAttendance' }, { type: object, required: [serverTime], properties: { serverTime: { type: string, format: date-time }, activeSession: { $ref: '#/components/schemas/WorkSession' } } }]
    MonthlyAttendance:
      type: object
      required: [month, days, workedMinutes, breakMinutes, plannedMinutes, balanceMinutes, requiresAction]
      properties: { month: { type: string }, days: { type: array, items: { $ref: '#/components/schemas/DailyAttendance' } }, workedMinutes: { type: integer }, breakMinutes: { type: integer }, plannedMinutes: { type: integer }, balanceMinutes: { type: integer }, requiresAction: { type: boolean } }
